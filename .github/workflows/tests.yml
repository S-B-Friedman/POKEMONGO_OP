name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, off the hour: upstream drift check only (see below).
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pytesseract is only a wrapper; the OCR itself is this binary. Installed
      # so test_text_extraction actually runs -- reading text off a screenshot
      # is the part of the image path with no other coverage.
      #
      # DejaVu goes with it. The OCR fixtures render their text with it, and
      # _font() falls back to Pillow's built-in bitmap font when it is missing --
      # which is legible at the 90px CP heading and illegible at the 17px
      # resource-row label. That failure looks like the reader losing the row,
      # not like a missing font, so pin the font rather than rely on whatever
      # the runner image happens to ship.
      - name: Install tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr fonts-dejavu-core

      # The OCR extras are installed so tests/test_ocr_pipeline.py actually
      # runs. It skips itself when OpenCV and Pillow are missing, so leaving
      # them out meant the image path was silently untested in CI -- and a
      # rewrite of the bar reader broke it without anything going red.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-api.txt -r requirements-ocr.txt

      - name: Tests
        run: python -m pytest tests/ -q

      # test_ocr_pipeline.py skips itself at import when these are absent, and a
      # skipped test is indistinguishable from a passing one in the summary.
      # Assert the precondition directly rather than parsing pytest output --
      # if these import, the image path really ran.
      #
      # pytesseract is deliberately not asserted: it needs the tesseract binary,
      # and gating a pull request on a system package is the kind of unrelated
      # red that teaches people to ignore CI. That one test may still skip.
      - name: OCR extras really installed
        run: python -c "import cv2, PIL; print('image path will run')"

      # Cost conformance runs inside the suite, against the committed
      # reference.json rather than the network -- see
      # tests/test_reference_and_import.py. These two just confirm the
      # entry points still work end to end.
      # sample_data is pre-joined from reference.json. It had drifted badly
      # before this was checked; offline, so it is safe to gate on.
      - name: Sample data matches reference
        run: python scripts/rebuild_sample_data.py --check

      - name: Solver runs
        run: python run.py

      - name: Benchmark runs
        run: python benchmark.py

      - name: API imports
        run: python -c "import api"

  # Upstream game data can change under us. That is worth knowing about, but it
  # is not a reason to fail someone's pull request, so it runs on a schedule and
  # never gates a merge.
  upstream-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diff costs.py against live GAME_MASTER
        run: python scripts/build_reference.py --check-costs
